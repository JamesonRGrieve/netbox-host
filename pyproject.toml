# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-host"
version = "0.0.1"
description = "Native NetBox source of truth for host and container OS configuration"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Jameson" }]
keywords = ["netbox", "netbox-plugin", "os", "systemd", "configuration"]
# PEP 639: the SPDX `license` expression above is authoritative; a `License ::`
# classifier alongside it is rejected by setuptools>=77, so it is intentionally omitted.
classifiers = [
    "Framework :: Django",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Repository = "https://github.com/JamesonRGrieve/netbox-host"

[tool.setuptools.packages.find]
include = ["netbox_host*"]

[tool.setuptools.package-data]
netbox_host = ["templates/netbox_host/*.html"]

[tool.ruff]
line-length = 120
# Django-generated migrations keep the framework's own list literals.
extend-exclude = ["netbox_host/migrations"]
